services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: svitlosk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d svitlosk"]
      interval: 5s
      timeout: 5s
      retries: 5

  publisher:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=svitlosk;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}
      - Telegram__BotToken=${TELEGRAM_BOT_TOKEN}
      - Telegram__TargetChatId=${TELEGRAM_CHAT_ID}
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_ENVIRONMENT=Production

volumes:
  postgres_data:
